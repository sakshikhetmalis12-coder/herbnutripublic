<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <filter id="plateShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#1b5e20" flood-opacity="0.15" />
    </filter>
  </defs>

  <!-- Outer Rim Plate -->
  <circle cx="250" cy="250" r="230" fill="#f9fbe7" stroke="#c8e6c9" stroke-width="8" filter="url(#plateShadow)" />
  <!-- Inner Rim -->
  <circle cx="250" cy="250" r="200" fill="#ffffff" stroke="#e0e0e0" stroke-width="2" />

  <!-- Section 1: Vegetables & Fruits (50% - Left Half) -->
  <path d="M250 250 L250 50 A200 200 0 0 0 250 450 Z" fill="#e8f5e9" stroke="#81c784" stroke-width="3" />
  
  <!-- Sub-partition Veggies vs Fruits -->
  <path d="M250 250 L60 215 A200 200 0 0 0 250 450 Z" fill="#e8f8f5" />
  
  <!-- Left Side Text & Icons -->
  <text x="140" y="170" font-family="'Segoe UI', Roboto, sans-serif" font-size="18" font-weight="bold" fill="#2e7d32" text-anchor="middle">🥗 VEGETABLES</text>
  <text x="140" y="195" font-family="'Segoe UI', Roboto, sans-serif" font-size="12" fill="#388e3c" text-anchor="middle">Broccoli, Spinach, Carrots</text>
  <text x="140" y="215" font-family="'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="bold" fill="#1b5e20" text-anchor="middle">~35% of Plate</text>

  <text x="140" y="315" font-family="'Segoe UI', Roboto, sans-serif" font-size="17" font-weight="bold" fill="#e65100" text-anchor="middle">🍎 FRUITS</text>
  <text x="140" y="340" font-family="'Segoe UI', Roboto, sans-serif" font-size="12" fill="#ef6c00" text-anchor="middle">Berries, Apples, Amla, Papaya</text>
  <text x="140" y="360" font-family="'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="bold" fill="#b71c1c" text-anchor="middle">~15% of Plate</text>

  <!-- Section 2: Whole Grains (25% - Top Right) -->
  <path d="M250 250 L250 50 A200 200 0 0 1 450 250 Z" fill="#fff8e1" stroke="#ffe082" stroke-width="3" />
  <text x="350" y="140" font-family="'Segoe UI', Roboto, sans-serif" font-size="17" font-weight="bold" fill="#f57f17" text-anchor="middle">🌾 WHOLE GRAINS</text>
  <text x="350" y="165" font-family="'Segoe UI', Roboto, sans-serif" font-size="12" fill="#f9a825" text-anchor="middle">Brown Rice, Oats, Quinoa, Millets</text>
  <text x="350" y="190" font-family="'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="bold" fill="#e65100" text-anchor="middle">25% of Plate</text>

  <!-- Section 3: Healthy Proteins (25% - Bottom Right) -->
  <path d="M250 250 L450 250 A200 200 0 0 1 250 450 Z" fill="#ede7f6" stroke="#d1c4e9" stroke-width="3" />
  <text x="350" y="325" font-family="'Segoe UI', Roboto, sans-serif" font-size="17" font-weight="bold" fill="#512da8" text-anchor="middle">🫘 HEALTHY PROTEINS</text>
  <text x="350" y="350" font-family="'Segoe UI', Roboto, sans-serif" font-size="12" fill="#5e35b1" text-anchor="middle">Lentils, Paneer, Tofu, Nuts, Eggs</text>
  <text x="350" y="375" font-family="'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="bold" fill="#4527a0" text-anchor="middle">25% of Plate</text>

  <!-- Center Hub / Healthy Oils & Water -->
  <circle cx="250" cy="250" r="46" fill="#ffffff" stroke="#2e7d32" stroke-width="4" />
  <text x="250" y="246" font-family="'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="bold" fill="#1b5e20" text-anchor="middle">💧 WATER &amp;</text>
  <text x="250" y="264" font-family="'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="bold" fill="#00796b" text-anchor="middle">HERBAL TEA</text>
</svg>
