<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="100%" height="100%">
  <defs>
    <linearGradient id="bgAshwa" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#efebe9" />
      <stop offset="100%" stop-color="#d7ccc8" />
    </linearGradient>
    <linearGradient id="ashwaRoot" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#d7ccc8" />
      <stop offset="100%" stop-color="#8d6e63" />
    </linearGradient>
  </defs>
  <rect width="400" height="300" rx="16" fill="url(#bgAshwa)" />
  <circle cx="200" cy="150" r="100" fill="#bcaaa4" opacity="0.3" />
  <!-- Plant Foliage & Red Berry Lanterns -->
  <path d="M200 230 Q200 120 180 70" stroke="#558b2f" stroke-width="4" fill="none" stroke-linecap="round" />
  <path d="M190 150 Q140 130 110 110" stroke="#558b2f" stroke-width="3" fill="none" stroke-linecap="round" />
  <path d="M190 120 Q240 100 270 80" stroke="#558b2f" stroke-width="3" fill="none" stroke-linecap="round" />
  
  <ellipse cx="110" cy="105" rx="22" ry="12" fill="#689f38" transform="rotate(-15 110 105)" />
  <ellipse cx="270" cy="75" rx="22" ry="12" fill="#689f38" transform="rotate(15 270 75)" />
  <ellipse cx="180" cy="65" rx="20" ry="12" fill="#558b2f" />

  <!-- Distinctive Calyx / Red Ashwagandha Berry Lanterns -->
  <path d="M140 140 C130 155 130 170 145 180 C160 170 160 155 150 140 Z" fill="#c62828" opacity="0.9" />
  <path d="M140 140 C135 150 135 165 145 178 C155 165 155 150 150 140 Z" fill="#d32f2f" />
  <circle cx="145" cy="160" r="7" fill="#e53935" />

  <path d="M230 125 C220 140 220 155 235 165 C250 155 250 140 240 125 Z" fill="#c62828" opacity="0.9" />
  <circle cx="235" cy="145" r="7" fill="#e53935" />

  <!-- Roots (Adaptogen root) -->
  <path d="M200 230 C190 250 175 275 160 285" stroke="#795548" stroke-width="4.5" stroke-linecap="round" fill="none" />
  <path d="M200 230 C210 255 230 275 245 285" stroke="#795548" stroke-width="4.5" stroke-linecap="round" fill="none" />
  <path d="M200 230 C202 260 205 285 204 290" stroke="#8d6e63" stroke-width="3.5" stroke-linecap="round" fill="none" />

  <!-- Botanical Badge -->
  <rect x="20" y="20" width="145" height="28" rx="14" fill="#ffffff" opacity="0.95" />
  <text x="32" y="39" font-family="'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="bold" fill="#4e342e">🌱 Ashwagandha</text>
  <rect x="230" y="255" width="150" height="28" rx="14" fill="#ffffff" opacity="0.95" />
  <text x="240" y="274" font-family="'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="600" fill="#5d4037">Withania somnifera</text>
</svg>
