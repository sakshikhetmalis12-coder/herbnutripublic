<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="100%" height="100%">
  <defs>
    <linearGradient id="bgMint" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#e0f2f1" />
      <stop offset="100%" stop-color="#b2dfdb" />
    </linearGradient>
    <linearGradient id="mintGreen" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#48c78e" />
      <stop offset="100%" stop-color="#00796b" />
    </linearGradient>
  </defs>
  <rect width="400" height="300" rx="16" fill="url(#bgMint)" />
  <circle cx="200" cy="150" r="100" fill="#80cbc4" opacity="0.3" />

  <!-- Mint Stems & Serrated Fresh Spearmint Leaves -->
  <path d="M200 250 Q195 160 200 65" stroke="#00796b" stroke-width="4.5" fill="none" stroke-linecap="round" />
  
  <!-- Leaf Pairs -->
  <!-- Bottom pair -->
  <path d="M195 210 C130 200 110 240 120 255 C160 255 185 225 195 210 Z" fill="url(#mintGreen)" />
  <path d="M205 210 C270 200 290 240 280 255 C240 255 215 225 205 210 Z" fill="url(#mintGreen)" />
  <!-- Middle pair -->
  <path d="M197 160 C135 130 120 180 135 195 C170 190 190 170 197 160 Z" fill="url(#mintGreen)" />
  <path d="M203 160 C265 130 280 180 265 195 C230 190 210 170 203 160 Z" fill="url(#mintGreen)" />
  <!-- Upper pair -->
  <path d="M198 115 C145 85 140 130 155 140 C180 135 195 122 198 115 Z" fill="url(#mintGreen)" />
  <path d="M202 115 C255 85 260 130 245 140 C220 135 205 122 202 115 Z" fill="url(#mintGreen)" />
  <!-- Top Bud -->
  <path d="M200 65 C185 85 195 105 200 105 C205 105 215 85 200 65 Z" fill="#26a69a" />

  <!-- Mint Texture Veins -->
  <path d="M140 180 L180 170" stroke="#ffffff" stroke-width="1.2" opacity="0.6" />
  <path d="M260 180 L220 170" stroke="#ffffff" stroke-width="1.2" opacity="0.6" />

  <!-- Botanical Badge -->
  <rect x="20" y="20" width="130" height="28" rx="14" fill="#ffffff" opacity="0.95" />
  <text x="32" y="39" font-family="'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="bold" fill="#00695c">🍃 Mint (Pudina)</text>
  <rect x="250" y="255" width="130" height="28" rx="14" fill="#ffffff" opacity="0.95" />
  <text x="260" y="274" font-family="'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="600" fill="#00796b">Mentha spicata</text>
</svg>
