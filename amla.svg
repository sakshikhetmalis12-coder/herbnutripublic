<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="100%" height="100%">
  <defs>
    <linearGradient id="bgAmla" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f1f8e9" />
      <stop offset="100%" stop-color="#c5e1a5" />
    </linearGradient>
    <radialGradient id="amlaBerry" cx="35%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#dce775" />
      <stop offset="60%" stop-color="#9ccc65" />
      <stop offset="100%" stop-color="#689f38" />
    </radialGradient>
  </defs>
  <rect width="400" height="300" rx="16" fill="url(#bgAmla)" />
  <circle cx="200" cy="150" r="100" fill="#aed581" opacity="0.3" />

  <!-- Feathered Pinnate Leaves Branch -->
  <path d="M70 180 Q200 130 330 80" stroke="#558b2f" stroke-width="3" fill="none" />
  <!-- Small leaflets -->
  <g fill="#7cb342">
    <ellipse cx="120" cy="155" rx="12" ry="4" transform="rotate(-30 120 155)" />
    <ellipse cx="140" cy="148" rx="12" ry="4" transform="rotate(-30 140 148)" />
    <ellipse cx="160" cy="140" rx="12" ry="4" transform="rotate(-30 160 140)" />
    <ellipse cx="180" cy="132" rx="12" ry="4" transform="rotate(-30 180 132)" />
    <ellipse cx="200" cy="125" rx="12" ry="4" transform="rotate(-30 200 125)" />
    <ellipse cx="220" cy="118" rx="12" ry="4" transform="rotate(-30 220 118)" />
    <ellipse cx="240" cy="110" rx="12" ry="4" transform="rotate(-30 240 110)" />
    <ellipse cx="260" cy="102" rx="12" ry="4" transform="rotate(-30 260 102)" />
    <ellipse cx="280" cy="95" rx="12" ry="4" transform="rotate(-30 280 95)" />
  </g>

  <!-- Large Translucent Glossy Amla Berries with 6 subtle ribs -->
  <!-- Berry 1 (Main Central) -->
  <circle cx="180" cy="200" r="48" fill="url(#amlaBerry)" stroke="#558b2f" stroke-width="1.5" />
  <!-- Ribs / Lines -->
  <path d="M180 152 Q160 200 180 248" stroke="#8bc34a" stroke-width="1.8" fill="none" opacity="0.7" />
  <path d="M180 152 Q200 200 180 248" stroke="#8bc34a" stroke-width="1.8" fill="none" opacity="0.7" />
  <circle cx="180" cy="153" r="3" fill="#33691e" />
  <ellipse cx="165" cy="180" rx="8" ry="14" fill="#ffffff" opacity="0.45" transform="rotate(-20 165 180)" />

  <!-- Berry 2 (Right) -->
  <circle cx="255" cy="215" r="40" fill="url(#amlaBerry)" stroke="#558b2f" stroke-width="1.5" />
  <path d="M255 175 Q240 215 255 255" stroke="#8bc34a" stroke-width="1.8" fill="none" opacity="0.7" />
  <ellipse cx="245" cy="195" rx="6" ry="10" fill="#ffffff" opacity="0.45" transform="rotate(-20 245 195)" />

  <!-- Berry 3 (Left Small) -->
  <circle cx="120" cy="225" r="32" fill="url(#amlaBerry)" stroke="#558b2f" stroke-width="1.5" />

  <!-- Botanical Badge -->
  <rect x="20" y="20" width="130" height="28" rx="14" fill="#ffffff" opacity="0.95" />
  <text x="32" y="39" font-family="'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="bold" fill="#33691e">🍈 Amla (Gooseberry)</text>
  <rect x="245" y="255" width="135" height="28" rx="14" fill="#ffffff" opacity="0.95" />
  <text x="255" y="274" font-family="'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="600" fill="#33691e">Phyllanthus emblica</text>
</svg>
