<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="100%" height="100%">
  <defs>
    <linearGradient id="bgNeem" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#e8f5e9" />
      <stop offset="100%" stop-color="#c8e6c9" />
    </linearGradient>
    <linearGradient id="neemLeaf" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#43a047" />
      <stop offset="100%" stop-color="#1b5e20" />
    </linearGradient>
  </defs>
  <rect width="400" height="300" rx="16" fill="url(#bgNeem)" />
  <circle cx="200" cy="150" r="100" fill="#a5d6a7" opacity="0.35" />

  <!-- Neem Twig & Curved Serrated Leaves -->
  <path d="M70 250 Q200 180 320 80" stroke="#2e7d32" stroke-width="4" fill="none" stroke-linecap="round" />
  
  <!-- Serrated Curved Falcate Neem Leaflets -->
  <path d="M120 215 C100 180 90 145 130 150 C125 175 125 195 120 215 Z" fill="url(#neemLeaf)" />
  <path d="M140 200 C160 165 180 140 185 160 C165 180 150 195 140 200 Z" fill="url(#neemLeaf)" />

  <path d="M180 170 C155 130 145 105 185 110 C180 135 180 155 180 170 Z" fill="url(#neemLeaf)" />
  <path d="M200 155 C225 120 245 95 250 115 C230 135 215 150 200 155 Z" fill="url(#neemLeaf)" />

  <path d="M240 125 C220 85 210 65 245 70 C240 95 240 115 240 125 Z" fill="url(#neemLeaf)" />
  <path d="M260 110 C285 75 305 50 310 70 C290 90 275 105 260 110 Z" fill="url(#neemLeaf)" />

  <!-- Terminal Leaf -->
  <path d="M315 85 C345 55 350 45 355 50 C345 75 325 85 315 85 Z" fill="url(#neemLeaf)" />

  <!-- Small white fragrant neem flowers -->
  <g fill="#ffffff">
    <circle cx="160" cy="180" r="3.5" /><circle cx="165" cy="177" r="3.5" /><circle cx="162" cy="184" r="3.5" />
    <circle cx="220" cy="135" r="3.5" /><circle cx="225" cy="132" r="3.5" /><circle cx="222" cy="139" r="3.5" />
  </g>
  <circle cx="162" cy="180" r="1.5" fill="#fbc02d" />
  <circle cx="222" cy="135" r="1.5" fill="#fbc02d" />

  <!-- Botanical Badge -->
  <rect x="20" y="20" width="130" height="28" rx="14" fill="#ffffff" opacity="0.95" />
  <text x="32" y="39" font-family="'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="bold" fill="#1b5e20">🌿 Neem (Indian Lilac)</text>
  <rect x="235" y="255" width="145" height="28" rx="14" fill="#ffffff" opacity="0.95" />
  <text x="245" y="274" font-family="'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="600" fill="#2e7d32">Azadirachta indica</text>
</svg>
