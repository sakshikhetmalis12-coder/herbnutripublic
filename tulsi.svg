<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGradTulsi" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#e8f5e9" />
      <stop offset="100%" stop-color="#c8e6c9" />
    </linearGradient>
    <linearGradient id="leafTulsi" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#4caf50" />
      <stop offset="100%" stop-color="#1b5e20" />
    </linearGradient>
    <linearGradient id="purpleFlowers" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ba68c8" />
      <stop offset="100%" stop-color="#6a1b9a" />
    </linearGradient>
    <linearGradient id="potGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#b85d38" />
      <stop offset="100%" stop-color="#8d3d1f" />
    </linearGradient>
  </defs>
  <rect width="400" height="300" rx="16" fill="url(#bgGradTulsi)" />
  <circle cx="200" cy="150" r="100" fill="#a5d6a7" opacity="0.4" />
  
  <!-- Traditional Terracotta Pot / Base -->
  <path d="M165 240 L160 275 Q160 282 170 282 L230 282 Q240 282 240 275 L235 240 Z" fill="url(#potGrad)" />
  <rect x="155" y="235" width="90" height="9" rx="4" fill="#a04d2b" />
  <!-- Pot sacred symbol / flower motif -->
  <circle cx="200" cy="260" r="6" fill="#fdd835" />

  <!-- Main Stems -->
  <path d="M200 235 Q200 160 200 80" stroke="#2e7d32" stroke-width="5" stroke-linecap="round" fill="none" />
  <path d="M200 190 Q170 160 145 140" stroke="#2e7d32" stroke-width="3.5" stroke-linecap="round" fill="none" />
  <path d="M200 170 Q235 140 260 120" stroke="#2e7d32" stroke-width="3.5" stroke-linecap="round" fill="none" />
  <path d="M200 130 Q165 110 150 90" stroke="#2e7d32" stroke-width="3" stroke-linecap="round" fill="none" />
  <path d="M200 115 Q230 95 245 75" stroke="#2e7d32" stroke-width="3" stroke-linecap="round" fill="none" />

  <!-- Tulsi Leaves (Opposite pairs, serrated oval look) -->
  <!-- Left Branch Leaves -->
  <ellipse cx="140" cy="135" rx="18" ry="10" transform="rotate(-30 140 135)" fill="url(#leafTulsi)" />
  <ellipse cx="160" cy="155" rx="16" ry="9" transform="rotate(-40 160 155)" fill="url(#leafTulsi)" />
  <!-- Right Branch Leaves -->
  <ellipse cx="265" cy="115" rx="18" ry="10" transform="rotate(30 265 115)" fill="url(#leafTulsi)" />
  <ellipse cx="235" cy="138" rx="16" ry="9" transform="rotate(25 235 138)" fill="url(#leafTulsi)" />
  <!-- Upper Leaves -->
  <ellipse cx="145" cy="85" rx="15" ry="8" transform="rotate(-25 145 85)" fill="url(#leafTulsi)" />
  <ellipse cx="170" cy="105" rx="14" ry="7" transform="rotate(-35 170 105)" fill="url(#leafTulsi)" />
  <ellipse cx="250" cy="70" rx="15" ry="8" transform="rotate(25 250 70)" fill="url(#leafTulsi)" />
  <ellipse cx="225" cy="90" rx="14" ry="7" transform="rotate(35 225 90)" fill="url(#leafTulsi)" />
  
  <!-- Central Cluster -->
  <ellipse cx="185" cy="150" rx="16" ry="9" transform="rotate(-20 185 150)" fill="#388e3c" />
  <ellipse cx="215" cy="150" rx="16" ry="9" transform="rotate(20 215 150)" fill="#2e7d32" />
  <ellipse cx="190" cy="110" rx="14" ry="8" transform="rotate(-15 190 110)" fill="#388e3c" />
  <ellipse cx="210" cy="110" rx="14" ry="8" transform="rotate(15 210 110)" fill="#2e7d32" />

  <!-- Tulsi Inflorescence / Flower spikes (Manjari) -->
  <g fill="url(#purpleFlowers)">
    <circle cx="200" cy="75" r="4" />
    <circle cx="197" cy="67" r="3.5" />
    <circle cx="203" cy="65" r="3.5" />
    <circle cx="198" cy="58" r="3" />
    <circle cx="202" cy="56" r="3" />
    <circle cx="200" cy="48" r="2.5" />
    <circle cx="200" cy="42" r="2" />
    <!-- Secondary Spike -->
    <circle cx="142" cy="80" r="3" />
    <circle cx="138" cy="73" r="2.5" />
    <circle cx="140" cy="66" r="2" />
    <!-- Third Spike -->
    <circle cx="252" cy="65" r="3" />
    <circle cx="256" cy="58" r="2.5" />
    <circle cx="254" cy="51" r="2" />
  </g>

  <!-- Botanical Badge -->
  <rect x="20" y="20" width="130" height="28" rx="14" fill="#ffffff" opacity="0.9" />
  <text x="32" y="39" font-family="'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="bold" fill="#1b5e20">🌿 Holy Basil</text>
  <rect x="250" y="252" width="130" height="28" rx="14" fill="#ffffff" opacity="0.9" />
  <text x="260" y="271" font-family="'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="600" fill="#2e7d32">Ocimum sanctum</text>
</svg>
